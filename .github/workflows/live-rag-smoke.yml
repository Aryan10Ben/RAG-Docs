name: Live RAG smoke test

on:
  push:
    branches:
      - design/thalius-inspired-minimal-v2
    paths:
      - "backend/tests/live_rag_smoke.py"
      - ".github/workflows/live-rag-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rag-check:
    name: Hosted PDF upload and answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: pip install requests reportlab
      - name: Upload PDF and verify answer from deployed API
        env:
          RAG_API_URL: https://rag-doc-q-a.onrender.com
        run: python backend/tests/live_rag_smoke.py

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in your shell first}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://sourcelens-rag.vercel.app}
    restart: unless-stopped
